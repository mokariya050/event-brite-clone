<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Eventbrite</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="signin-page">

    <div class="signin-container">

        <div class="signin-card">

            <div class="logo">
                <span class="logo-icon">☰</span>
                <span>eventbrite</span>
            </div>

            <h1>Welcome!<br>What's your email?</h1>

            <form id="signinForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <button type="submit" class="continue-btn">
                    Continue
                </button>

            </form>

            <div class="divider">
                <span></span>
                <p>Or sign in with</p>
                <span></span>
            </div>

            <div class="social-login">

                <button type="button" class="social-btn">
                    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/apple.svg" alt="Apple">
                </button>

                <button type="button" class="social-btn">
                    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/google.svg" alt="Google">
                </button>

                <button type="button" class="social-btn">
                    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/facebook.svg" alt="Facebook">
                </button>

            </div>

            <p class="terms">
                By clicking Continue or the icons below, you agree to
                Eventbrite's
                <a href="#">Terms of Service</a> and
                <a href="#">Privacy Policy</a>.
            </p>

            <a href="#" class="help-link">
                Need help finding your tickets?
            </a>

        </div>

    </div>

</body>
</html>
