<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – Eventbrite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- CSS is one level up -->
  <link rel="stylesheet" href="../style.css">
</head>
<body class="page--signin">

  <!-- Background image -->
  <div class="si2-bg" aria-hidden="true">
    <img src="../images/boston.jpg" alt="" class="si2-bg__img">
    <div class="si2-bg__overlay"></div>
  </div>

  <!-- Centered white card -->
  <div class="si2-wrap" role="main">
    <div class="si2-card" id="si2Card">

      <!-- Logo → back to home -->
      <a href="../index.html" class="si2-logo" aria-label="Back to Eventbrite">
        <svg viewBox="0 0 36 36" width="28" height="28" fill="none" aria-hidden="true">
          <circle cx="18" cy="18" r="18" fill="#f05537"/>
          <path d="M11 14h14M11 18h9M11 22h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span>eventbrite</span>
      </a>

      <!-- Step 1: Email -->
      <div class="si2-step" id="stepEmail">
        <h1 class="si2-title">Welcome!<br>What's your email?</h1>
        <form id="formEmail" novalidate class="si2-form">
          <div class="si2-field" id="fEmail">
            <input class="si2-input" type="email" id="emailInput" placeholder="Email" autocomplete="email" required>
            <span class="si2-err" id="errEmail" aria-live="polite"></span>
          </div>
          <button type="submit" class="si2-btn-primary">
            <span class="si2-btn-label">Continue</span>
            <span class="si2-spinner" aria-hidden="true"></span>
          </button>
        </form>

        <div class="si2-divider"><span>Or sign in with</span></div>

        <p class="si2-terms">
          By clicking Continue or the icons below, you agree to Eventbrite's
          <a href="#" class="si2-link">Terms of Service</a> and <a href="#" class="si2-link">Privacy Policy</a>.
        </p>

        <div class="si2-socials">
          <button type="button" class="si2-social-btn" aria-label="Continue with Apple">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
              <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.4c1.4.07 2.38.73 3.19.73.98 0 2.82-.9 4.75-.77 1.09.05 3.65.44 4.72 2.98-5.08 3.33-3.1 8.65 1.34 9.94zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
            </svg>
          </button>
          <button type="button" class="si2-social-btn" aria-label="Continue with Google">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
          </button>
          <button type="button" class="si2-social-btn" aria-label="Continue with Facebook">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="#1877F2" d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.235 2.686.235v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.27h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
            </svg>
          </button>
        </div>

        <a href="#" class="si2-help-link">Need help finding your tickets?</a>
      </div>

      <!-- Step 2: Password -->
      <div class="si2-step si2-step--hidden" id="stepPassword">
        <button class="si2-back" id="backBtn" type="button" aria-label="Go back">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
        </button>
        <h1 class="si2-title">Enter your password</h1>
        <p class="si2-email-display" id="emailDisplay"></p>
        <form id="formPassword" novalidate class="si2-form">
          <div class="si2-field" id="fPassword">
            <div class="si2-input-wrap">
              <input class="si2-input" type="password" id="passwordInput" placeholder="Password" autocomplete="current-password" required>
              <button type="button" class="si2-eye" id="eyeBtn" aria-label="Show password">
                <svg class="si2-eye__show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="si2-eye__hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <span class="si2-err" id="errPassword" aria-live="polite"></span>
          </div>
          <div class="si2-forgot-row"><a href="#" class="si2-link si2-link--sm">Forgot password?</a></div>
          <button type="submit" class="si2-btn-primary" id="loginSubmitBtn">
            <span class="si2-btn-label">Log in</span>
            <span class="si2-spinner" aria-hidden="true"></span>
          </button>
        </form>
      </div>

    </div>
  </div>

  <!-- Success toast -->
  <div class="si2-toast" id="si2Toast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
    Logged in! Redirecting…
  </div>

  <!-- JS is one level up -->
  <script src="../script.js"></script>
</body>
</html>
